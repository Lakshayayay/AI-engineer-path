<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gift Genie 🧞</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <!-- SIDEBAR FOR HISTORY & ACCOUNTS -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-brand">
            <img src="assets/genie.svg" alt="Genie" class="sidebar-genie-img" />
            <span>Genie Panel</span>
          </div>
          <button id="close-sidebar-btn" class="mobile-close-btn" aria-label="Close Sidebar">&times;</button>
        </div>

        <!-- AUTH CONTROL SECTION -->
        <div class="auth-section">
          <div id="user-info" class="user-info hidden">
            <div class="user-avatar" id="user-avatar-initials">U</div>
            <div class="user-details">
              <div class="user-name" id="display-name-text">User</div>
              <div class="user-email" id="email-text">user@example.com</div>
              <div class="mode-badge" id="mode-badge">Local Mode</div>
            </div>
            <button id="logout-btn" class="icon-btn" title="Sign Out">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-log-out"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
          </div>
          <div id="guest-info" class="guest-info">
            <p>Sign in to save your gift ideas and history.</p>
            <button id="open-auth-btn" class="auth-action-btn">Sign In / Register</button>
          </div>
        </div>

        <!-- HISTORY SECTION -->
        <div class="history-section">
          <h3>Recent Wishes</h3>
          <div id="history-list" class="history-list">
            <p class="empty-history-text">No previous wishes found. Summon some gifts first!</p>
          </div>
        </div>
      </aside>

      <!-- MAIN APP CONTAINER -->
      <div class="app-container">
        <header class="app-header">
          <div class="header-left">
            <button id="menu-toggle-btn" class="menu-toggle-btn" aria-label="Toggle Sidebar">
              <svg viewBox="0 0 100 80" width="24" height="24" fill="currentColor">
                <rect width="100" height="15" rx="5"></rect>
                <rect y="30" width="100" height="15" rx="5"></rect>
                <rect y="60" width="100" height="15" rx="5"></rect>
              </svg>
            </button>
            <div class="title-group">
              <img src="assets/genie.svg" alt="Genie" class="genie-icon-img" />
              <h1>Gift Genie</h1>
            </div>
          </div>
          <div class="header-right">
            <span class="active-mode-indicator" id="header-mode-indicator">Local Mode</span>
          </div>
        </header>

        <main class="main-content">
          <form id="gift-form" class="gift-form">
            <div class="input-section">
              <div class="input-wrapper">
                <textarea
                  id="user-input"
                  placeholder="e.g., My friend who loves hiphop music has a birthday coming up in 3 days. 40-60 bucks budget. I live in..."
                ></textarea>
              </div>
            </div>

            <div class="lamp-container">
              <button
                type="submit"
                id="lamp-button"
                class="lamp-btn"
                aria-label="Rub the Lamp"
              >
                <span class="lamp-icon">
                  <img
                    src="assets/lamp.svg"
                    alt="Magic Lamp"
                    class="lamp-icon-img"
                  />
                </span>
                <span class="lamp-text">Rub the Lamp</span>
              </button>
            </div>
          </form>

          <section class="output-section">
            <div id="output-container" class="hidden">
              <div id="output-content"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- AUTHENTICATION MODAL -->
    <div id="auth-modal" class="modal-overlay hidden">
      <div class="modal-content glassmorphism">
        <button id="close-auth-btn" class="modal-close-btn">&times;</button>
        <div class="auth-tabs">
          <button id="tab-login" class="tab-btn active">Sign In</button>
          <button id="tab-signup" class="tab-btn">Register</button>
        </div>

        <form id="auth-form" class="auth-form">
          <div class="form-group" id="name-group" style="display: none;">
            <label for="auth-name">Name</label>
            <input type="text" id="auth-name" placeholder="John Doe" />
          </div>
          <div class="form-group">
            <label for="auth-email">Email Address</label>
            <input type="email" id="auth-email" required placeholder="name@example.com" />
          </div>
          <div class="form-group">
            <label for="auth-password">Password</label>
            <input type="password" id="auth-password" required placeholder="••••••••" />
          </div>
          <div id="auth-error-msg" class="auth-error hidden"></div>
          <button type="submit" id="auth-submit-btn" class="submit-btn">Sign In</button>
        </form>

        <div class="auth-divider">
          <span>or continue with</span>
        </div>

        <button id="google-signin-btn" class="google-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google Account
        </button>
      </div>
    </div>

    <!-- MARKED AND DOMPURIFY INJECTED IN MODULE -->
    <script type="module" src="./index.js"></script>
  </body>
</html>
